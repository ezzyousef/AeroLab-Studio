name: Windows build

# Builds the Windows executable, portable zip and installer with the repository's own
# build.ps1 (tests, PyInstaller, self-test of the built exe, Inno Setup), and uploads
# them as a downloadable artifact of the run.
on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-planck-3addcx]
    tags: ["v*"]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (tests, exe, self-test, zip, installer)
        shell: pwsh
        run: ./build.ps1

      - name: Check the outputs exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/*.zip,dist/*.exe -ErrorAction SilentlyContinue
          $files | Format-Table Name, Length
          if (-not ($files | Where-Object Name -like "*.zip")) { throw "portable zip missing" }
          if (-not ($files | Where-Object Name -like "*.exe")) { throw "installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: AeroLabStudio-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
